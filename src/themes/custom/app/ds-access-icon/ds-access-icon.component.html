    <a class="dont-break-out" [href]="url">

<div class="itooltip">
      <img *ngIf="url.includes('/c_f1cf')"  width="50" height="50" 
      alt="Embargo"
      src="assets/custom/images/zamky_Partialy_closed_access_hodiny.png">
  <span class="itooltiptext">&nbsp;{{ 'access-icon.tooltip-Partialy_closed_access_hodiny' | translate  }}&nbsp;</span>
</div>

<div class="itooltip">
      <img *ngIf="url.includes('/c_14cb')"  width="50" height="50" 
      alt="Pouze metadata"
      src="assets/custom/images/zamky_Closed_access.png">
  <span class="itooltiptext">{{'access-icon.tooltip-closed' | translate  }}</span>
</div>

<div class="itooltip">
      <img *ngIf="url.includes('/c_abf2')"  width="50" height="50" 
      alt="Otevřený přístup"
      src="assets/custom/images/zamky_Open_access.png">

  <span class="itooltiptext">{{'access-icon.tooltip-open' | translate }}</span>
</div>


<div class="itooltip">
      <img *ngIf="url.includes('/c_16ec')"  width="50" height="50" 
      alt="Omezený přístup"
      src="assets/custom/images/zamky_Partialy_closed_access_instituce.png">
  <span class="itooltiptext">{{'access-icon.tooltip-Partialy_closed_access_instituce' | translate }}</span>
</div>

   </a>
